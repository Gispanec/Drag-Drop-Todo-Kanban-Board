<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="Flow — спокойное пространство для ваших задач. Независимые Kanban-доски, удобное перетаскивание и локальное хранение." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Flow — ваши задачи в порядке</title>
    <style>
      #flow-diagnostics[hidden] { display: none; }
      #flow-diagnostics { position: fixed; z-index: 9999; inset: auto 12px 12px; max-width: 520px; max-height: 65vh; overflow: auto; padding: 16px; border: 1px solid #bcc6d3; border-radius: 12px; background: #fff; color: #17212e; box-shadow: 0 8px 32px #17212e40; font: 14px/1.4 system-ui, sans-serif; }
      #flow-diagnostics[data-failed="true"] { inset: 12px 12px auto; border-color: #ba3b39; }
      #flow-diagnostics h2 { margin: 0 0 8px; font-size: 18px; }
      #flow-diagnostics p { margin: 8px 0; }
      #flow-diagnostics pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      #flow-diagnostics textarea { box-sizing: border-box; width: 100%; height: 150px; padding: 8px; }
      #flow-diagnostics button { margin-top: 8px; padding: 8px 12px; }
    </style>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('flow-kanban:v1') || 'null')?.settings?.theme;
        document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { /* Основное приложение покажет ошибку чтения хранилища. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <aside id="flow-diagnostics" hidden aria-live="assertive">
      <h2>Диагностика Flow</h2>
      <p id="flow-diagnostic-status"></p>
      <pre id="flow-diagnostic-error"></pre>
      <label for="flow-diagnostic-report">Отчёт без данных досок и задач</label>
      <textarea id="flow-diagnostic-report" readonly></textarea>
      <button id="flow-diagnostic-copy" type="button">Копировать отчёт</button>
      <p id="flow-diagnostic-copy-status"></p>
    </aside>
    <script>
      (() => {
        const debug = new URLSearchParams(location.search).get('debug') === '1';
        const panel = document.getElementById('flow-diagnostics');
        const status = document.getElementById('flow-diagnostic-status');
        const errorText = document.getElementById('flow-diagnostic-error');
        const report = document.getElementById('flow-diagnostic-report');
        const copyStatus = document.getElementById('flow-diagnostic-copy-status');
        let ready = false;
        let failure = null;

        function storageAvailable() {
          try { window.localStorage.getItem('__flow_diagnostic_probe__'); return true; }
          catch { return false; }
        }

        function resourceCounts() {
          const paths = performance.getEntriesByType('resource').map(entry => new URL(entry.name).pathname);
          return {
            scripts: paths.filter(path => /\.(js|jsx|ts|tsx)$/.test(path)).length,
            styles: paths.filter(path => path.endsWith('.css')).length,
            fonts: paths.filter(path => /\.(woff2?|ttf|otf)$/.test(path)).length,
          };
        }

        function update() {
          panel.hidden = !debug && !failure;
          panel.dataset.failed = String(Boolean(failure));
          status.textContent = failure ? 'Ошибка загрузки или работы Flow' : ready ? 'Flow запущен' : 'Ожидание запуска Flow…';
          errorText.textContent = failure ? `Текст ошибки (не включён в отчёт): ${failure.message}` : '';
          const counts = resourceCounts();
          report.value = [
            'Flow diagnostics',
            `Status: ${failure ? 'error' : ready ? 'ready' : 'loading'}`,
            `Stage: ${failure?.stage || 'none'}`,
            `Error type: ${failure?.name || 'none'}`,
            `Secure context: ${window.isSecureContext ? 'yes' : 'no'}`,
            `crypto.randomUUID: ${typeof window.crypto?.randomUUID === 'function' ? 'available' : 'unavailable'}`,
            `crypto.getRandomValues: ${typeof window.crypto?.getRandomValues === 'function' ? 'available' : 'unavailable'}`,
            `localStorage access: ${storageAvailable() ? 'yes' : 'no'}`,
            `Observed JS requests: ${counts.scripts}`,
            `Observed CSS requests: ${counts.styles}`,
            `Observed font requests: ${counts.fonts}`,
          ].join('\n');
        }

        function fail(stage, name, message) {
          if (failure) return;
          failure = {
            stage: ['startup', 'react', 'script', 'resource', 'promise', 'timeout'].includes(stage) ? stage : 'script',
            name: ['Error', 'TypeError', 'ReferenceError', 'SyntaxError', 'SecurityError'].includes(name) ? name : 'Other',
            message: String(message || 'Неизвестная ошибка'),
          };
          update();
        }

        window.addEventListener('error', event => {
          if (event.error) fail('script', event.error.name, event.error.message);
          else if (event.target !== window) fail('resource', 'Error', 'Не загрузился ресурс страницы.');
        }, true);
        window.addEventListener('unhandledrejection', event => {
          fail('promise', event.reason?.name, event.reason?.message || event.reason);
        });
        window.addEventListener('flow:failure', event => {
          fail(event.detail?.stage, event.detail?.name, event.detail?.message);
        });
        window.addEventListener('flow:ready', () => { ready = true; update(); });
        window.addEventListener('load', update);

        async function copyReport() {
          try {
            if (!navigator.clipboard?.writeText) throw new Error('Clipboard API недоступен');
            await navigator.clipboard.writeText(report.value);
            copyStatus.textContent = 'Отчёт скопирован.';
            return;
          } catch { /* На HTTP-адресе телефона Clipboard API обычно недоступен. */ }
          report.focus();
          report.select();
          try {
            if (document.execCommand('copy')) { copyStatus.textContent = 'Отчёт скопирован.'; return; }
          } catch { /* Оставляем текст выделенным для ручного копирования. */ }
          copyStatus.textContent = 'Автокопирование недоступно. Текст выделен — скопируйте его вручную.';
        }
        document.getElementById('flow-diagnostic-copy').addEventListener('click', copyReport);
        window.setTimeout(() => { if (!ready && !failure) fail('timeout', 'Error', 'Приложение не завершило запуск за 10 секунд.'); }, 10000);
        update();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
